[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-trade-supply-analysis"
version = "1.1.0"
description = "Business-facing energy intelligence dashboard for country outlooks and global trend monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.1",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["src*"]
